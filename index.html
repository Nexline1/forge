<body>

<div class="grain" aria-hidden="true"></div>
<div class="field" aria-hidden="true"></div>

<div class="app">

  <header class="masthead">
    <a class="lockup" href="./" aria-label="Forge by Bahrain AI — start over">
      <span class="lockup__badge">
        <img src="assets/img/aibh-mascot.png" alt="" width="44" height="44">
      </span>
      <span class="lockup__text">
        <span class="lockup__name">Forge</span>
        <span class="lockup__by">Bahrain AI</span>
      </span>
    </a>

    <div class="masthead__right">
      <span class="counter" id="counter" hidden>
        <span class="counter__now" id="counterNow">01</span><span class="counter__sep">/</span><span class="counter__all" id="counterAll">10</span>
      </span>
      <button class="ghostbtn" id="restartBtn" type="button" hidden>Start over</button>
    </div>
  </header>

  <div class="progress" id="progress" hidden>
    <div class="progress__bar" id="progressBar"></div>
  </div>

  <main class="stage" id="stage" tabindex="-1"></main>

  <footer class="actionbar" id="actionbar" hidden>
    <div class="actionbar__inner">
      <button class="btn btn--ghost" id="backBtn" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <div class="actionbar__hint" id="actionHint"></div>
      <button class="btn btn--primary" id="nextBtn" type="button">
        <span id="nextLabel">Continue</span>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
